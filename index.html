<!DOCTYPE html>
<html>
<head>
    <title>Contador</title>
    <style>
*{
    margin: 20px;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: black;
    color:white;
    display:grid;
    place-items:center;
    }
section {
background: rgba(255,255,255,0.2);
padding: 20px;
border-radius: 5px;
text-align: center;


}

p {
    font-size: 100px;
}
 button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body> 
    
   <section> 
    <h1>CONTADOR</h1>
    <p>0</p>
    <button onclick="diminuir()">menos</button>
    <button onclick="aumentar()">mais</button>
</section>
<Script>
    let contador = 0;
    
    function aumentar() {
        contador = contador + 1
        mostrar()
    }
    function diminuir() {
        contador = contador - 1
        mostrar()
    }
    function mostrar(){
        const p = document.querySelector("p")
        p.innerText = contador
    }
</Script>
</body>

</html>
